services:

  api:
    image: api:latest
    build:
      context: search-services
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - 28080:8080
    volumes:
      - ./search-services/api/config.yaml:/config.yaml
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - TOKEN_TTL=2m
      - API_ADDRESS=:8080
      - WORDS_ADDRESS=words:8080
      - UPDATE_ADDRESS=update:8080
      - SEARCH_ADDRESS=search:8080
      - SEARCH_CONCURRENCY=10
      - SEARCH_RATE=100
    depends_on:
      - words
      - update
      - search

  words:
    image: words:latest
    build:
      context: search-services
      dockerfile: Dockerfile.words
    restart: unless-stopped
    ports:
      - 28081:8080
    volumes:
      - ./search-services/words/config.yaml:/config.yaml
    environment:
      - WORDS_ADDRESS=:8080

  update:
    image: update:latest
    build:
      context: search-services
      dockerfile: Dockerfile.update
    restart: unless-stopped
    ports:
      - 28082:8080
    volumes:
      - ./search-services/update/config.yaml:/config.yaml
    environment:
      - UPDATE_ADDRESS=:8080
      - DB_ADDRESS=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-postgres}
      - XKCD_URL=https://xkcd.com
      - XKCD_CONCURRENCY=10
      - WORDS_ADDRESS=words:8080
      - BROKER_ADDRESS=nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      words:
        condition: service_started
      nats:
        condition: service_started

  frontend:
    image: frontend:latest
    build:
      context: search-services
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - 28084:8080
    volumes:
      - ./search-services/frontend/config.yaml:/config.yaml
    environment:
      - FRONTEND_ADDRESS=:8080
      - API_ADDRESS=http://api:8080
      - TOKEN_TTL=2m

  tests:
    image: tests:latest
    build: tests
    restart: "no"
    entrypoint: "true"

  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "18888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

  search:
    image: search:latest
    build:
      context: search-services
      dockerfile: Dockerfile.search
    restart: unless-stopped
    ports:
      - 28083:8080
    volumes:
      - ./search-services/search/config.yaml:/config.yaml
    environment:
      - SEARCH_ADDRESS=:8080
      - DB_ADDRESS=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-postgres}
      - WORDS_ADDRESS=words:8080
      - INDEX_TTL=24h
      - BROKER_ADDRESS=nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      words:
        condition: service_started
      nats:
        condition: service_started


  nats:
    image: nats
    ports:
      - "4222:4222"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.125.0
    ports:
      - 8428:8428
    volumes:
      - vmdata:/storage
      - ./metrics/promscrape.yml:/etc/promscrape.yml
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/promscrape.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - "victoriametrics"
    ports:
      - 3000:3000
    volumes:
      - grafanadata:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres:
  pgadmin:
  vmdata:
  grafanadata:
