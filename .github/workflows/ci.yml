name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: search-services/go.mod
          cache-dependency-path: |
            search-services/go.sum
            examples/go.sum
            tests/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l search-services tests examples)"

      - name: Vet services
        working-directory: search-services
        run: go vet ./...

      - name: Vet examples
        working-directory: examples
        run: go vet ./...

      - name: Vet integration tests
        working-directory: tests
        run: go vet ./...

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: search-services/go.mod
          cache-dependency-path: |
            search-services/go.sum
            examples/go.sum
            tests/go.sum

      - name: Build services
        working-directory: search-services
        run: go build ./...

      - name: Build examples
        working-directory: examples
        run: go build ./...

      - name: Compile integration tests
        working-directory: tests
        run: go test -run '^$' ./...

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: search-services/go.mod
          cache-dependency-path: |
            search-services/go.sum
            examples/go.sum
            tests/go.sum

      - name: Test services
        working-directory: search-services
        run: go test -race ./...

      - name: Test examples
        working-directory: examples
        run: go test ./...