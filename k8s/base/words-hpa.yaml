apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: words
  namespace: xkcd

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: words

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60